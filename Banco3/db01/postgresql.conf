# ==========================================================
# BANCO 3 - PostgreSQL Configuration (Extracto de Parametros Activos)
# Ubicacion en nodo DB01: /data/postgresql/postgresql.conf
# Estado: Verificado en produccion
# ==========================================================
listen_addresses = '*'
max_connections = 100
unix_socket_directories = '/run/postgresql'
shared_buffers = 64MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
